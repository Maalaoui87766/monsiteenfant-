<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Days of the Week | English</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7fa;
    text-align:center;
    color:#333;
}

header{
    background:#4CAF50;
    color:white;
    padding:20px;
    font-size:26px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.card{
    background:white;
    margin:12px auto;
    padding:18px;
    max-width:400px;
    border-radius:20px;
    box-shadow:0 2px 6px #ccc;
}

.english{
    font-size:28px;
    font-weight:bold;
    color:#2196F3;
}

.arabic{
    font-size:20px;
    color:#555;
    margin-top:6px;
}

.speak{
    margin-top:12px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#4CAF50;
    color:white;
    font-size:17px;
}

.back{
    display:inline-block;
    margin:20px;
    padding:12px 20px;
    background:#2196F3;
    color:white;
    text-decoration:none;
    border-radius:20px;
    font-size:17px;
}

</style>
</head>

<body>

<header>
📅 Days of the Week
</header>

<div class="container">

<div class="card">
    <div class="english">Monday</div>
    <div class="arabic">الإثنين</div>
    <button class="speak" onclick="speakEnglish('Monday')">🔊 Listen</button>
</div>

<div class="card">
    <div class="english">Tuesday</div>
    <div class="arabic">الثلاثاء</div>
    <button class="speak" onclick="speakEnglish('Tuesday')">🔊 Listen</button>
</div>

<div class="card">
    <div class="english">Wednesday</div>
    <div class="arabic">الأربعاء</div>
    <button class="speak" onclick="speakEnglish('Wednesday')">🔊 Listen</button>
</div>

<div class="card">
    <div class="english">Thursday</div>
    <div class="arabic">الخميس</div>
    <button class="speak" onclick="speakEnglish('Thursday')">🔊 Listen</button>
</div>

<div class="card">
    <div class="english">Friday</div>
    <div class="arabic">الجمعة</div>
    <button class="speak" onclick="speakEnglish('Friday')">🔊 Listen</button>
</div>

<div class="card">
    <div class="english">Saturday</div>
    <div class="arabic">السبت</div>
    <button class="speak" onclick="speakEnglish('Saturday')">🔊 Listen</button>
</div>

<div class="card">
    <div class="english">Sunday</div>
    <div class="arabic">الأحد</div>
    <button class="speak" onclick="speakEnglish('Sunday')">🔊 Listen</button>
</div>

<a href="english.html" class="back">⬅️ Back to English</a>

</div>

<script>

function speakEnglish(text){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";
        speech.rate = 0.8;
        speech.pitch = 1;
        speech.volume = 1;

        speechSynthesis.speak(speech);

    }else{

        alert("Speech is not available in this browser.");

    }

}

</script>

</body>
</html>
