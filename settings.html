<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الإعدادات</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

⚙️ الإعدادات

</header>



<div class="container">


<div class="card">


<h2>
🔊 الصوت
</h2>

<p>
🔊 سيتم إضافة التحكم في الصوت في الإصدار القادم.
</p>


</div>




<div class="card">


<h2>
⭐ التقدم
</h2>


<p>
عدد النجوم الحالية:
<span id="stars">0</span>
</p>


<button onclick="resetData()">

🗑️ مسح التقدم

</button>


</div>




<div class="card">


<h2>
👦 الطفل
</h2>


<p>
يمكن تغيير اسم الطفل من ملف الطفل.
</p>


</div>


</div>



<a class="back" href="home.html">

⬅️ العودة للرئيسية

</a>



<script>


let points=localStorage.getItem("points") || 0;

document.getElementById("stars").innerHTML=points;



function resetData(){

let ok = confirm("هل تريد مسح جميع بيانات الطفل؟");

if(ok){

localStorage.removeItem("points");
localStorage.removeItem("childName");

localStorage.removeItem("memory_done");
localStorage.removeItem("puzzle_done");
localStorage.removeItem("color_done");

localStorage.removeItem("quiz_rabbit_done");
localStorage.removeItem("quiz_ant_done");
localStorage.removeItem("quiz_fox_done");
localStorage.removeItem("quiz_bird_done");
localStorage.removeItem("quiz_tree_done");

alert("✅ تم مسح جميع بيانات التقدم");

location.reload();

}

}

</script>



</body>

</html>
