<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather | English</title>

<style>

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7fa;
    text-align:center;
    color:#333;
}

header{
    background:#4CAF50;
    color:white;
    padding:20px;
    font-size:26px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.card{
    background:white;
    margin:12px auto;
    padding:20px;
    max-width:400px;
    border-radius:20px;
    box-shadow:0 2px 6px #ccc;
}

.emoji{
    font-size:50px;
}

.english{
    font-size:28px;
    font-weight:bold;
    color:#2196F3;
    margin-top:8px;
}

.arabic{
    font-size:20px;
    color:#555;
    margin-top:6px;
}

.speak{
    margin-top:12px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#4CAF50;
    color:white;
    font-size:17px;
}

.back{
    display:inline-block;
    margin:20px;
    padding:12px 20px;
    background:#2196F3;
    color:white;
    text-decoration:none;
    border-radius:20px;
    font-size:17px;
}

</style>
</head>

<body>

<header>
🌦️ Weather
</header>

<div class="container">

<div class="card">
    <div class="emoji">☀️</div>
    <div class="english">Sunny</div>
    <div class="arabic">مشمس</div>
    <button class="speak" onclick="speakEnglish('Sunny')">
        🔊 Listen
    </button>
</div>

<div class="card">
    <div class="emoji">🌧️</div>
    <div class="english">Rainy</div>
    <div class="arabic">ممطر</div>
    <button class="speak" onclick="speakEnglish('Rainy')">
        🔊 Listen
    </button>
</div>

<div class="card">
    <div class="emoji">☁️</div>
    <div class="english">Cloudy</div>
    <div class="arabic">غائم</div>
    <button class="speak" onclick="speakEnglish('Cloudy')">
        🔊 Listen
    </button>
</div>

<div class="card">
    <div class="emoji">💨</div>
    <div class="english">Windy</div>
    <div class="arabic">عاصف</div>
    <button class="speak" onclick="speakEnglish('Windy')">
        🔊 Listen
    </button>
</div>

<div class="card">
    <div class="emoji">❄️</div>
    <div class="english">Snowy</div>
    <div class="arabic">مثلج</div>
    <button class="speak" onclick="speakEnglish('Snowy')">
        🔊 Listen
    </button>
</div>

<div class="card">
    <div class="emoji">⛈️</div>
    <div class="english">Stormy</div>
    <div class="arabic">عاصف / ممطر</div>
    <button class="speak" onclick="speakEnglish('Stormy')">
        🔊 Listen
    </button>
</div>

<div class="card">
    <div class="emoji">🌫️</div>
    <div class="english">Foggy</div>
    <div class="arabic">ضبابي</div>
    <button class="speak" onclick="speakEnglish('Foggy')">
        🔊 Listen
    </button>
</div>

<a href="english.html" class="back">
⬅️ Back to English
</a>

</div>

<script>

function speakEnglish(text){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";
        speech.rate = 0.8;
        speech.pitch = 1;
        speech.volume = 1;

        speechSynthesis.speak(speech);

    }else{

        alert("Speech is not available in this browser.");

    }

}

</script>

</body>
</html>
