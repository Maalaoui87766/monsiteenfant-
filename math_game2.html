<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رياضيات ممتعة</title>

<link rel="stylesheet" href="css/style.css">

<style>

.game{

background:white;
margin:20px;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 0 10px #ccc;

}

button{

width:80%;
margin:10px;
padding:15px;
font-size:25px;
border-radius:15px;

}

</style>

</head>

<body>

<header>

🧮 رياضيات ممتعة

</header>


<div class="game">

<h2 id="question"></h2>


<button onclick="checkAnswer(0)" id="b1"></button>

<button onclick="checkAnswer(1)" id="b2"></button>

<button onclick="checkAnswer(2)" id="b3"></button>


</div>

<script src="./js/app.js"></script>>


<script>

let correct;


function newQuestion(){


let a=Math.floor(Math.random()*10)+1;

let b=Math.floor(Math.random()*10)+1;


correct=a+b;


document.getElementById("question").innerHTML=
"كم يساوي "+a+" + "+b+" ؟";


let answers=[correct, correct+1, correct-1];


answers.sort(()=>Math.random()-0.5);


document.getElementById("b1").innerHTML=answers[0];

document.getElementById("b2").innerHTML=answers[1];

document.getElementById("b3").innerHTML=answers[2];


window.answers=answers;


}


function checkAnswer(i){


if(window.answers[i]==correct){


ajouterPoints(10);

alert("🎉 إجابة صحيحة +10 نجوم");

newQuestion();


}else{


alert("❌ حاول مرة أخرى");


}


}


newQuestion();


</script>


</body>

</html>
