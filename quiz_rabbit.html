<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختبار قصة الأرنب الصغير</title>

<link rel="stylesheet" href="css/style.css">

<style>

.quiz{

background:white;
margin:20px;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 0 10px #ccc;

}

.quiz button{

display:block;
width:90%;
margin:10px auto;
padding:12px;
font-size:20px;
border:none;
border-radius:15px;
background:#4CAF50;
color:white;

}

#next{

background:#2196F3;
display:none;

}

</style>

</head>

<body>

<header>

❓ اختبار قصة الأرنب الصغير

</header>

<div class="quiz">

<h2 id="question"></h2>

<div id="answers"></div>

<button id="next" onclick="suivant()">

➡️ السؤال التالي

</button>

</div>

<script src="js/app.js"></script>

<script>

const questions=[

{

q:"أَيْنَ كَانَ يَعِيشُ الْأَرْنَبُ؟",

answers:[

"فِي الْغَابَةِ",

"فِي الْبَحْرِ",

"فِي الْمَدِينَةِ"

],

correct:0

},

{

q:"مَنْ قَابَلَ الْأَرْنَبُ؟",

answers:[

"عُصْفُورًا صَغِيرًا",

"أَسَدًا",

"فِيلًا"

],

correct:0

},

{

q:"مَاذَا تَعَلَّمَ الْأَرْنَبُ؟",

answers:[

"مُسَاعَدَةَ الْآخَرِينَ",

"الْكَسَلَ",

"الْغَضَبَ"

],

correct:0

}

];

let index=0;

let score=0;

function afficher(){

document.getElementById("next").style.display="none";

document.getElementById("question").innerHTML=

questions[index].q;

let html="";

questions[index].answers.forEach((rep,i)=>{

html+=`<button onclick="verifier(${i})">${rep}</button>`;

});

document.getElementById("answers").innerHTML=html;

}

function verifier(i){

let buttons = document.querySelectorAll("#answers button");

// تعطيل كل الأزرار بعد الاختيار
buttons.forEach(btn=>{
    btn.disabled = true;
});


if(i==questions[index].correct){

score+=10;

ajouterPoints(10);

alert("✅ إجابة صحيحة");

}else{

alert("❌ إجابة خاطئة");

}


document.getElementById("next").style.display="block";

}

function suivant(){

index++;

if(index<questions.length){

afficher();

}else{
localStorage.setItem("quiz_tree_done","yes");
document.body.innerHTML=`

<header>

🏆 النتيجة

</header>

<div class="quiz">

<h2>

🎉 أَحْسَنْتَ

</h2>

<h1>

⭐ ${score}/30

</h1>

<p>

لقد حصلت على ${score} نقطة.

</p>

<a class="read" href="stories.html">

📚 العودة إلى القصص

</a>

</div>

`;

}

}

afficher();

</script>

</body>

</html>
