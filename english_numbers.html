<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>English Numbers - أكاديمية الطفل الذكي</title>

<link rel="stylesheet" href="css/style.css">

<style>

.numbers-page{
    max-width:900px;
    margin:auto;
    padding:15px;
}

.numbers-header{
    background:white;
    border-radius:20px;
    padding:18px;
    text-align:center;
    margin-bottom:15px;
    box-shadow:0 2px 6px #ccc;
}

.numbers-header h2{
    color:#4CAF50;
    font-size:24px;
    margin-bottom:8px;
}

.numbers-header p{
    color:#555;
    font-size:16px;
}

.numbers-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.number-card{
    background:white;
    border-radius:25px;
    min-height:220px;
    padding:18px 10px;
    text-align:center;
    box-shadow:0 3px 8px #ccc;
}

.number{
    font-size:60px;
    font-weight:bold;
    color:#2196F3;
    margin:0;
}

.number-word{
    font-size:27px;
    font-weight:bold;
    color:#222;
    margin-top:8px;
}

.number-arabic{
    font-size:20px;
    color:#777;
    margin-top:10px;
}

.speak-button{
    width:78px;
    height:78px;
    border:none;
    border-radius:50%;
    background:#4CAF50;
    color:white;
    font-size:36px;
    margin-top:14px;
    cursor:pointer;
    box-shadow:0 2px 5px #bbb;
}

.speak-button:active{
    transform:scale(.94);
}

.back-button{
    display:block;
    width:220px;
    margin:25px auto;
    padding:13px;
    background:#2196F3;
    color:white;
    text-decoration:none;
    text-align:center;
    border-radius:20px;
    font-size:18px;
}

@media(max-width:600px){

    .numbers-page{
        padding:10px;
    }

    .numbers-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .number-card{
        min-height:210px;
        padding:15px 6px;
    }

    .number{
        font-size:52px;
    }

    .number-word{
        font-size:23px;
    }

    .number-arabic{
        font-size:17px;
    }

    .speak-button{
        width:70px;
        height:70px;
        font-size:32px;
    }

}

</style>

</head>

<body>

<header>
🇬🇧 English Numbers 🇬🇧
</header>

<section class="numbers-header">

<h2>🔢 Numbers 1–10</h2>

<script>

function speakEnglish(text){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const speech =
        new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";

        speech.rate = 0.8;

        speech.pitch = 1;

        speech.volume = 1;

        speechSynthesis.speak(speech);

    }else{

        alert(
        "Speech is not available in this browser."
        );

    }

}

</script>
