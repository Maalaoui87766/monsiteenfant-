<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لعبة الحروف</title>

<style>

body{
font-family:Tahoma;
background:#FFF0F5;
text-align:center;
}

h1{
background:#E91E63;
color:white;
padding:20px;
}

button{
font-size:35px;
margin:10px;
padding:20px;
border-radius:15px;
border:none;
background:white;
box-shadow:0 0 8px gray;
cursor:pointer;
}

button:hover{
background:#FFD700;
}

#message{
font-size:25px;
color:green;
}

</style>

</head>


<body>

<h1>🧩 رتب الحروف</h1>

<h2>اضغط الحروف بالترتيب:</h2>

<div>

<button onclick="اختيار('أ')">أ</button>
<button onclick="اختيار('ب')">ب</button>
<button onclick="اختيار('ت')">ت</button>

</div>


<h2 id="message"></h2>

<p>⭐ النقاط : <span id="score">0</span></p>


<script>

let ترتيب=["أ","ب","ت"];

let مكان=0;

let نقاط=0;


function اختيار(حرف){

if(حرف==ترتيب[مكان]){

مكان++;

document.getElementById("message").innerHTML=
"أحسنت ⭐";


if(مكان==3){

نقاط+=20;

document.getElementById("score").innerHTML=نقاط;

document.getElementById("message").innerHTML=
"🎉 ممتاز! أكملت اللعبة";

مكان=0;

}

}else{

document.getElementById("message").innerHTML=
"❌ حاول من جديد";

}

}

</script>


</body>
</html>
