<script>

function speakEnglish(text){

    if("speechSynthesis" in window){

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";
        speech.rate = 0.8;
        speech.pitch = 1;
        speech.volume = 1;

        speechSynthesis.speak(speech);

    }else{

        alert("Speech is not available in this browser.");

    }

}

</script>
