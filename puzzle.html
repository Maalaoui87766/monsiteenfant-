<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لعبة البازل</title>

<link rel="stylesheet" href="css/style.css">

<style>

.puzzle{

display:grid;
grid-template-columns:repeat(2,120px);
gap:10px;
justify-content:center;
margin:30px;

}


.piece{

width:120px;
height:120px;
background:#2196F3;
color:white;
font-size:45px;
display:flex;
align-items:center;
justify-content:center;
border-radius:20px;
cursor:pointer;

}


.selected{

border:5px solid #4CAF50;

}

</style>

</head>


<body>


<header>

🧩 لعبة البازل

</header>



<h2 style="text-align:center;">
رَتِّبِ الصُّوَرَ بِشَكْلٍ صَحِيح
</h2>



<div class="puzzle" id="puzzle"></div>



<a class="back" href="home.html">

⬅️ العودة للرئيسية

</a>




<script src="js/app.js"></script>



<script>


let correct=[

"🐶",
"🐱",
"🐰",
"🐼"

];



let pieces=[

"🐱",
"🐼",
"🐶",
"🐰"

];



let first=null;



let puzzle=document.getElementById("puzzle");





pieces.forEach(function(item){



let div=document.createElement("div");


div.className="piece";


div.innerHTML=item;





div.onclick=function(){



if(first==null){


first=div;


div.classList.add("selected");


}

else{



let temp=first.innerHTML;


first.innerHTML=div.innerHTML;


div.innerHTML=temp;



first.classList.remove("selected");


first=null;



checkPuzzle();



}



}



puzzle.appendChild(div);



});






function checkPuzzle(){



let current=[];



document.querySelectorAll(".piece").forEach(function(p){


current.push(p.innerHTML);


});





if(JSON.stringify(current)==JSON.stringify(correct)){



if(localStorage.getItem("puzzle_done")!="yes"){



ajouterPoints(50);



localStorage.setItem("puzzle_done","yes");



alert("🎉 ممتاز! أكملت البازل +50 نجمة");



}

else{


alert("✅ لقد حصلت على مكافأة البازل من قبل");


}



}



}



</script>



</body>

</html>
