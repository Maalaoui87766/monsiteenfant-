<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شهادة نجاح</title>

<style>

body{
font-family:Tahoma;
background:#FFF8DC;
text-align:center;
}

.certificat{

background:white;
border:5px solid #FFD700;
border-radius:20px;
margin:40px;
padding:30px;
}

h1{
color:#009688;
}

input{

font-size:20px;
padding:10px;
text-align:center;

}

button{

font-size:20px;
padding:12px 25px;
background:#4CAF50;
color:white;
border:none;
border-radius:10px;

}

#nom{

font-size:30px;
color:#E91E63;

}

</style>

</head>


<body>


<div class="certificat">

<h1>🏆 شهادة نجاح 🏆</h1>

<p>أدخل اسمك يا بطل:</p>

<input id="اسم" placeholder="اسم الطفل">


<br><br>

<button onclick="اظهار()">
عرض الشهادة
</button>


<h2 id="nom"></h2>

<p>
تهانينا! لقد أكملت أنشطة التعلم بنجاح ⭐
</p>


</div>



<script>

function اظهار(){

let اسم=document.getElementById("اسم").value;

document.getElementById("nom").innerHTML=
"الطفل: "+اسم+" 🌟";

}

</script>


</body>
</html>
