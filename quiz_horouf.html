<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اختبار الحروف العربية</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

🔤 اختبار الحروف

</header>



<div class="container">


<div class="card">


<h2 id="question"></h2>


<div id="answers"></div>


<h3 id="result"></h3>


<h3>
⭐ النقاط: <span id="score">0</span>
</h3>


</div>


</div>



<a class="back" href="lessons.html">

⬅️ العودة إلى الدروس

</a>



<script>


let questions=[

{
q:"ما هو الحرف الذي يبدأ به اسم أسد؟ 🦁",
a:["أ","ب","ت"],
correct:"أ"
},

{
q:"ما هو الحرف الذي يبدأ به اسم بطة؟ 🦆",
a:["ث","ب","ج"],
correct:"ب"
},

{
q:"ما هو الحرف الذي يبدأ به اسم تفاحة؟ 🍎",
a:["ت","س","م"],
correct:"ت"
},

{
q:"ما هو الحرف الذي يبدأ به اسم فيل؟ 🐘",
a:["ف","ل","ن"],
correct:"ف"
},

{
q:"ما هو الحرف الذي يبدأ به اسم حصان؟ 🐴",
a:["ح","د","ر"],
correct:"ح"
}

];


let index=0;

let score=0;


function showQuestion(){


let q=questions[index];


document.getElementById("question").innerHTML=q.q;


let box=document.getElementById("answers");

box.innerHTML="";


q.a.forEach(function(x){


let btn=document.createElement("button");

btn.innerHTML=x;


btn.onclick=function(){

check(x);

};


box.appendChild(btn);


});


}


function check(answer){

let result=document.getElementById("result");

if(index >= questions.length){
    return;
}


if(answer == questions[index].correct){

score += 10;

result.innerHTML="🎉 إجابة صحيحة ⭐";

}
else{

result.innerHTML="❌ حاول مرة أخرى";

}


document.getElementById("score").innerHTML=score;


index++;


if(index < questions.length){

setTimeout(showQuestion,1000);

}
else{

setTimeout(function(){

result.innerHTML="🏆 انتهى الاختبار نتيجتك: "+score;

},1000);

}

}


showQuestion();


</script>



</body>

</html>
