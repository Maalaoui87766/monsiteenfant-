<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لعبة الذاكرة</title>

<link rel="stylesheet" href="css/style.css">

<style>

.game{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:20px;

}


.card{

height:80px;
background:#2196F3;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
cursor:pointer;

}


.open{

background:white;

}

</style>

</head>


<body>


<header>

🧩 لعبة الذاكرة

</header>



<div class="game" id="game"></div>



<a class="back" href="home.html">

⬅️ العودة للرئيسية

</a>



<script src="js/app.js"></script>



<script>


let images=[

"🍎","🍎",
"🐱","🐱",
"🚗","🚗",
"🌟","🌟"

];



images.sort(()=>Math.random()-0.5);



let first=null;

let second=null;

let lock=false;

let found=0;



let game=document.getElementById("game");





images.forEach(function(img){



let card=document.createElement("div");


card.className="card";


card.dataset.value=img;


card.innerHTML="❓";





card.onclick=function(){



if(lock || card.classList.contains("open"))

return;





card.innerHTML=img;


card.classList.add("open");





if(first==null){


first=card;


}

else{


second=card;




if(first.dataset.value==second.dataset.value){



found+=2;



first=null;

second=null;





if(found==images.length){



if(localStorage.getItem("memory_done")!="yes"){



ajouterPoints(50);


localStorage.setItem("memory_done","yes");



alert("🎉 أحسنت! أكملت لعبة الذاكرة +50 نجمة");



}

else{


alert("✅ لقد حصلت على مكافأة لعبة الذاكرة من قبل");


}



}



}



else{



lock=true;



setTimeout(function(){


first.innerHTML="❓";

second.innerHTML="❓";


first.classList.remove("open");

second.classList.remove("open");



first=null;

second=null;


lock=false;



},800);



}



}



}




game.appendChild(card);



});



</script>



</body>

</html>
